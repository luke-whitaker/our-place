# Local development database for Our Place.
#
# Keeps day-to-day dev work OFF the production database (Railway). The connection
# string below is already wired into `.env` (Prisma CLI/seed) and
# `.env.development.local` (the Next.js dev server).
#
# Usage:
#   docker compose up -d      # start the dev Postgres in the background
#   npm run db:migrate        # apply Prisma migrations to it
#   npm run db:seed           # seed the 9 starter communities
#   npm run db:studio         # browse it
#   docker compose down       # stop it (data persists in the named volume)
#   docker compose down -v    # stop AND wipe the data (fresh start)
#
# The password here is a throwaway dev credential, not a secret — this file is
# committed on purpose so the setup is reproducible.
#
# The major version tracks Railway's production Postgres (18 as of Sept 2026).
# It matters beyond general parity: pg_dump and pg_restore refuse to read an
# archive from a newer server, so a dev database behind production cannot
# restore a production backup, which is the one thing a backup must allow.
#
# Postgres will not start on a data directory created by a different major
# version, so bumping this needs a volume reset:
#   docker compose down -v && docker compose up -d
#   npx prisma migrate deploy && npm run db:seed && npm run db:create-admin

services:
  db:
    image: postgres:18-alpine
    container_name: ourplace-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourplace
      POSTGRES_PASSWORD: ourplace
      POSTGRES_DB: ourplace
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a major-version-specific subdirectory
      # and expect the mount one level up, at /var/lib/postgresql. Mounting the
      # old /var/lib/postgresql/data path makes the container refuse to start.
      - ourplace-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourplace -d ourplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ourplace-dev-db:
