name: Backup database

# Railway's scheduled backups and PITR are Pro-plan features. This does the
# same job on the current plan: a nightly pg_dump into a private R2 bucket,
# pruned to the retention window in scripts/backup-db.ts.
on:
  schedule:
    # 08:10 UTC, a quiet hour for a US-central audience.
    - cron: "10 8 * * *"
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # pg_dump refuses to dump a server newer than itself, so this must be at
      # or above Railway's Postgres major version (18 as of Sept 2026). Raise
      # it when Railway upgrades; the failure is loud and names both versions.
      #
      # The runner ships postgresql-client-16 and Debian's /usr/bin/pg_dump is
      # a version-selecting wrapper, so installing a newer client is not
      # enough on its own. Putting the versioned bin directory first on PATH
      # is what actually decides which binary runs.
      - name: Install postgresql-client
        env:
          PG_MAJOR: "18"
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version

      - run: npm ci

      - name: Dump and upload
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          # Optional. When set, the script refuses to write into the public
          # media bucket by mistake.
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npx tsx scripts/backup-db.ts
