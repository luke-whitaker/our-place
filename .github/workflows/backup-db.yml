name: Backup database

# Railway's scheduled backups and PITR are Pro-plan features. This does the
# same job on the current plan: a nightly pg_dump into a private R2 bucket,
# pruned to the retention window in scripts/backup-db.ts.
on:
  schedule:
    # 08:10 UTC, a quiet hour for a US-central audience.
    - cron: "10 8 * * *"
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install the newest client so it can dump whatever major version
      # Railway runs (pg_dump reads servers at or below its own version).
      - name: Install postgresql-client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - run: npm ci

      - name: Dump and upload
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          # Optional. When set, the script refuses to write into the public
          # media bucket by mistake.
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npx tsx scripts/backup-db.ts
