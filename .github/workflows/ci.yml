name: CI

# The gates this project has always run by hand: Prettier, ESLint at zero
# warnings, tsc, the unit tests, and a production build. Running them on every
# push is worth it on its own, and it is also the prerequisite for Railway's
# "Wait for CI" setting, which cannot be enabled safely while pushes produce
# no check runs at all.
on:
  push:
  pull_request:

# A newer push makes an in-flight run for the same branch irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Route tests (test:routes) exercise real handlers against a real
    # Postgres — see verify-restore.yml for the same pattern. The version
    # must match or exceed production's major version (18), like everywhere
    # else Postgres runs in Actions.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ourplace
          POSTGRES_PASSWORD: ourplace
          POSTGRES_DB: ourplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # .npmrc sets ignore-scripts, so the Prisma client is not generated on
      # install. Everything below needs src/generated to exist.
      - run: npm run db:generate

      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test

      - name: Route tests
        env:
          TEST_DATABASE_URL: postgresql://ourplace:ourplace@localhost:5432/ourplace_test
        run: npm run test:routes

      # Catches a build that breaks only in a production compile, which is
      # otherwise discovered by Railway after the push has already landed.
      #
      # next build evaluates module-level code while collecting page data, and
      # src/lib/auth.ts throws without JWT_SECRET. These are the same
      # throwaway placeholders the Dockerfile's builder stage uses, not
      # secrets: the real values are injected at runtime.
      - name: Build
        env:
          JWT_SECRET: build-placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run build
