name: Deploy drift check

# Railway silently stopped deploying between July 7 and September 1, 2026.
# Nothing broke visibly, because Railway keeps serving the last good build
# forever, so a healthy site looked like a shipped one. This job compares the
# newest Railway deployment against main and fails when they drift, which
# sends the repo owner the usual failed-workflow email.
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      grace_minutes:
        description: "Grace window for an in-flight deploy. Set 0 to test that the alarm still fires."
        required: false
        default: "45"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      # Full history: the check diffs main against the deployed commit, which
      # may be many commits back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare deployed commit against main
        env:
          # Railway deploys without reliably writing a GitHub deployment
          # record, so those records report drift that is not real. Ask the
          # running app instead: it cannot be wrong about what it is running.
          SITE: https://www.ourplaceonline.com
          # A deploy takes a few minutes, so a very recent commit is not drift.
          # Overridable on manual runs so the alarm itself can be tested.
          GRACE_MINUTES: ${{ inputs.grace_minutes || '45' }}
        run: |
          set -euo pipefail

          head_sha=$(git rev-parse HEAD)
          head_epoch=$(git show -s --format=%ct HEAD)
          age_minutes=$(( ( $(date -u +%s) - head_epoch ) / 60 ))

          if ! version_json=$(curl -fsS --max-time 20 "$SITE/api/version"); then
            echo "Could not read $SITE/api/version."
            echo "Either the site is down, or a build without the version endpoint is live."
            version_json=""
          fi
          deployed_sha=$(printf '%s' "$version_json" | jq -r '.commit // ""' 2>/dev/null || echo "")
          [ "$deployed_sha" = "unknown" ] && deployed_sha=""

          echo "main     : $head_sha (committed ${age_minutes}m ago)"
          echo "deployed : ${deployed_sha:-unreadable}"

          if [ "$deployed_sha" = "$head_sha" ]; then
            echo "In sync."
            exit 0
          fi

          if [ "$age_minutes" -lt "$GRACE_MINUTES" ]; then
            echo "Newest commit is under ${GRACE_MINUTES}m old; a deploy may still be in flight."
            exit 0
          fi

          # Railway can be configured to watch only app paths, and docs- or
          # tooling-only commits then never produce a deployment. Alarming on
          # those would train the reader to ignore this job, so only the files
          # that actually change what production runs count as drift. The
          # version endpoint lives in src, so it is covered by this list.
          if [ -n "$deployed_sha" ] && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            app_changes=$(git diff --name-only "$deployed_sha" "$head_sha" -- \
              src prisma public package.json package-lock.json \
              Dockerfile start.sh next.config.ts prisma.config.ts | head -5)
            if [ -z "$app_changes" ]; then
              echo "Undeployed commits touch no app files. Nothing to ship."
              exit 0
            fi
            echo
            echo "Undeployed app changes:"
            echo "$app_changes" | sed 's/^/  /'
          fi

          echo
          echo "DRIFT: main has not been deployed."
          echo "Production is serving ${deployed_sha:-an unreadable commit}, not $head_sha."
          echo "Check the Railway dashboard: service > Settings > Source (the GitHub"
          echo "authorization has dropped before), and the Deployments tab for failures."
          exit 1
